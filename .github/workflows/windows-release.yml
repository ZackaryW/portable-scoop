name: Windows validation and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test and vet
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE) { throw 'Go tests failed' }
          go vet ./...
          if ($LASTEXITCODE) { throw 'Go vet failed' }
      - name: Test bootstrap in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/installer/bootstrap-tests.ps1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Package verified Windows x64 payload
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') { throw 'Expected a vMAJOR.MINOR.PATCH tag with optional prerelease suffix' }
          ./scripts/package.ps1 -Version $env:RELEASE_TAG.Substring(1)
      - name: Publish installer assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = Join-Path 'dist/release-assets' $env:RELEASE_TAG.Substring(1)
          $arguments = @('release', 'create', $env:RELEASE_TAG, '--verify-tag', '--generate-notes')
          if ($env:RELEASE_TAG.Contains('-')) { $arguments += '--prerelease' }
          $arguments += @((Join-Path $assets 'portscoop-windows-amd64.zip'), (Join-Path $assets 'portscoop-windows-amd64.zip.sha256'))
          gh @arguments
          if ($LASTEXITCODE) { throw 'GitHub release publication failed' }
